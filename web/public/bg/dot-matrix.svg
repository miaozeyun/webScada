<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a13"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#1f3d5c" opacity="0.55"/>
    </pattern>
    <linearGradient id="bandL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7ec0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2a7ec0" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#2a7ec0" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2a7ec0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5f96" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1d5f96" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1d5f96" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bottomGlow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#1b5fa6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect x="360" width="120" height="1080" fill="url(#bandL)"/>
  <rect x="1480" width="90" height="1080" fill="url(#bandR)"/>
  <rect width="1920" height="1080" fill="url(#bottomGlow)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
