<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14212e" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314212e'/%3E%3Cpath d='M5 21H11L14 12L18 24L21 16H27' fill='none' stroke='%231ba7b8' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>webScada · 组态监控平台</title>
    <style>
      /* 首屏占位：JS 就绪前显示品牌 splash，app.mount 后由 Vue 整体替换。
         样式全部内联（不依赖 CSS bundle 加载时序），配色为默认主题（electric） */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #e9edf1;
        color: #22313f;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
        z-index: 9999;
      }
      .boot-splash svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #0b7285;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .boot-name {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .boot-sub {
        margin: 0;
        font-size: 12px;
        color: #8394a3;
      }
      .boot-line {
        width: 120px;
        height: 2px;
        overflow: hidden;
        background: #cbd5df;
        position: relative;
      }
      .boot-line::after {
        content: '';
        position: absolute;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #1ba7b8;
        animation: boot-scan 1.1s ease-in-out infinite;
      }
      @keyframes boot-scan {
        to { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line::after { animation: none; left: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="0.75" y="0.75" width="30.5" height="30.5" />
          <path d="M5 21 H11 L14 12 L18 24 L21 16 H27" />
        </svg>
        <p class="boot-name">webScada 组态监控平台</p>
        <i class="boot-line" aria-hidden="true"></i>
        <p class="boot-sub">正在启动控制台…</p>
      </div>
    </div>
    <noscript>本平台需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
