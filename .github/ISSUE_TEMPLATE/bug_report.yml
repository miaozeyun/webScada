name: Bug 报告
description: 报告一个可复现的缺陷
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的最小步骤。
        **安全问题请不要在此提交**，见 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#7-安全漏洞)。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 编辑器（拖拽/属性面板/撤销重做）
        - 运行态 / 大屏渲染
        - 数据接入（MQTT / REST / WS / Modbus TCP / OPC UA / Mock）
        - 报警规则与通知
        - 历史趋势查询
        - 分享页 / 发布
        - 用户权限 / 审计
        - 部署与容器
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建工程，添加一个数值组件
        2. 绑定变量 var_xxx
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴完整堆栈
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交号
      placeholder: v0.2.0 或 git commit hash
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - docker compose（官方四容器）
        - 本地开发（vite dev + uvicorn）
        - 离线一体机
        - 其他
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 120 / Edge 118
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 服务端日志 / 浏览器控制台
      render: shell
    validations:
      required: false
