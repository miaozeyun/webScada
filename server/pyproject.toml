[project]
name = "webscada-server"
version = "0.1.0"
description = "webScada 开源核心后端（FastAPI + PostgreSQL，只读监控）"
requires-python = ">=3.12"
dependencies = [
    # Web 框架与运行服务
    "fastapi>=0.115",
    # uvicorn[standard] 含 websockets：既是 WS 协议后端，也是上游 WS 数据源客户端依赖（架构差异 #11）
    "uvicorn[standard]>=0.30",
    # ORM 与数据库（异步 SQLAlchemy 2.0 + Pydantic v2）
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",            # 本地测试用 SQLite 异步驱动（生产为 PG）
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 鉴权与加密
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",         # 数据源凭证 Fernet 加密（G6）
    # 数据接入（M3 起 collector 使用；M0 先入依赖锁定版本）
    "httpx>=0.27",                # REST 轮询 + 测试客户端
    "aiomqtt>=2.3",               # MQTT 订阅
    "websockets>=12.0",           # 上游 WebSocket 客户端
    # 工具
    "loguru>=0.7",
    "python-multipart>=0.0.9",    # 导入接口 multipart 文件上传
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
