# webScada 官网静态站 nginx 配置（独立容器版，纯 HTTP）
#
# 由 deploy/website/docker-compose.yml 挂载为 /etc/nginx/conf.d/default.conf，
# 站点根目录 /usr/share/nginx/html 是宿主机 website/ 的只读挂载。
#
# 缓存口径与主站一致：HTML 不缓存（改版立刻生效）、带后缀资源短缓存 1h。
# 这里刻意用 expires 而不是 add_header：nginx 的 add_header 是「本级覆盖上级」，
# location 里一旦写了 add_header，server 级的安全头就全部失效。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 不回显版本号，减少指纹信息
    server_tokens off;

    # 静态站无登录态，主要是防内容嗅探与第三方 iframe 套壳
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    # text/html 默认已在压缩范围，显式列出会触发 duplicate MIME type 告警
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;

    # 隐藏目录（.git / .preview 等）一律拒绝
    location ~ /\. {
        deny all;
    }

    # GEO / 收录类文件不缓存：事实或链接更新后搜索引擎与 AI 爬虫立即拿到新内容
    location = /llms.txt    { expires -1; }
    location = /robots.txt  { expires -1; }
    location = /sitemap.xml { expires -1; }

    # 资源文件名无内容哈希：只给 1h 短缓存，改版后才能及时生效（勿设 immutable）
    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|webm|mp4)$ {
        expires 1h;
        access_log off;
    }

    # 静态多页站：不做 SPA 回落，未命中直接 404（保留真实 404 语义给搜索引擎）
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
