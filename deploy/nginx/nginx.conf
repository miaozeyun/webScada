# webScada Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
# 依据：docs/design/01-整体架构与目录结构.md 部署拓扑 + 03-接口清单 §3.1

# WebSocket 升级头映射（标准写法）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WS 查询串 token 脱敏（附录 A10）：token 走查询串，日志中以固定掩码替代
map $arg_token $ws_token_logged {
    default "MASKED";
    ""      "-";
}

# 路径中的 token 脱敏（M6 分享链接 /s/{token}、管理面 /shares/{token}）：
# 日志记录掩码后的路径，防 token 入日志（附录 A10；REST 的 JWT 在 Authorization 头不落日志）
map $uri $uri_logged {
    ~^/s/.+$                /s/MASKED;
    ~^/api/v1/share/.+$     /api/v1/share/MASKED;
    ~^/api/v1/shares/.+$    /api/v1/shares/MASKED;
    default                 $uri;
}

log_format ws_masked '$remote_addr - [$time_local] "$request_method $uri_logged $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" token=$ws_token_logged';

server {
    listen 80;
    server_name _;
    # ---- HTTP→HTTPS 升级指引（商用 P0：TLS 收口）----
    # 证书就绪并完成浏览器/客户端验证后，建议将本 server 块收缩为纯跳转：
    #   return 301 https://$host$request_uri;
    # 并删除下方全部 location（443 server 块已包含同构配置，注意双块同步维护）。
    # 过渡期保留 80 直服，便于未启用 TLS 的存量内网部署平滑升级。

    # 前端静态资源（web 构建产物已随镜像打入）
    root /usr/share/nginx/html;
    index index.html;

    # 运行态 WebSocket 反代：
    # - 升级头必须显式设置，否则握手失败（R8）
    # - proxy_read_timeout 75s > 心跳判死周期 40s（20s ping × 2），防默认 60s 切断空闲长连接（G18/R8）
    # - 日志走 /dev/stdout（进 docker logs 与日志驱动轮转），查询串与路径中的 token 均掩码
    location /api/v1/ws/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        access_log /dev/stdout ws_masked;
    }

    # REST 反代（导入上传走 multipart，body 上限放宽；doc 2MB 硬校验在应用层 G21）
    location /api/v1/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        access_log /dev/stdout ws_masked;
    }

    # 运维指标（M8 根路径 /metrics，METRICS_TOKEN 可选鉴权在应用层；抓取方多为内网，免日志）
    location = /metrics {
        allow 127.0.0.0/8;      # 仅内网抓取（公网入口默认不可读；应用层 METRICS_TOKEN 为第二道防线）
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # 分享页路由（前端 SPA /s/:token）：允许 iframe 嵌入（P0 占位策略 frame-ancestors *，企业版可收紧白名单）。
    # 关键：用 rewrite...break 在本 location 内直接以 root 提供文件，不做 try_files 内部重定向——
    # 内部重定向会重新匹配 location，导致此处声明的响应头丢失（复查 major 修复）。
    location /s/ {
        add_header Content-Security-Policy "frame-ancestors *";
        add_header Cache-Control "no-cache";
        access_log /dev/stdout ws_masked;
        rewrite ^ /index.html break;
    }

    # 带内容哈希的构建产物：长缓存 immutable（文件名变即内容变）
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 其余路径：SPA history 模式回落；非 /s/ 路径默认禁止被嵌入。
    # HTML 不缓存（no-cache 走协商缓存）：保证发版后浏览器立刻拿到新入口，避免旧页面引用已删除的哈希产物
    location / {
        add_header X-Frame-Options SAMEORIGIN;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# HTTPS（443）server 块：商用 P0「TLS 收口」落地
# 证书目录：容器内 /etc/nginx/certs（compose 卷挂载宿主机 ./deploy/certs）
# 自签证书生成：bash scripts/gen-selfsigned-cert.sh（compose 首次 up 时
# tls-init 一次性服务亦会自动补齐缺失的自签证书）
# 生产环境：替换为企业 CA / Let's Encrypt 证书（保持同名文件重启容器即可），
# 并在上游网关侧规划 301 跳转与 HSTS（自签阶段不加 HSTS，避免锁死浏览器）。
# 注意：以下 location 与 80 块保持同构，改动必须双块同步。
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 前端静态资源（web 构建产物已随镜像打入）
    root /usr/share/nginx/html;
    index index.html;

    # 运行态 WebSocket 反代（同 80 块：升级头 + 75s 读超时 > 心跳判死 40s）
    location /api/v1/ws/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        access_log /dev/stdout ws_masked;
    }

    # REST 反代（导入上传 multipart 上限与 80 块一致）
    location /api/v1/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        access_log /dev/stdout ws_masked;
    }

    # 运维指标（与 80 块一致，双块同步维护）
    location = /metrics {
        allow 127.0.0.0/8;      # 仅内网抓取（公网入口默认不可读；应用层 METRICS_TOKEN 为第二道防线）
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # 分享页路由（允许 iframe 嵌入，与 80 块同策略；rewrite...break 防内部重定向丢响应头）
    location /s/ {
        add_header Content-Security-Policy "frame-ancestors *";
        add_header Cache-Control "no-cache";
        access_log /dev/stdout ws_masked;
        rewrite ^ /index.html break;
    }

    # 带内容哈希的构建产物：长缓存 immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 其余路径：SPA history 模式回落（与 80 块同构）
    location / {
        add_header X-Frame-Options SAMEORIGIN;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
